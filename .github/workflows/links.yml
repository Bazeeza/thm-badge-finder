name: Check room links
# TryHackMe rate-limits non-browser clients (HTTP 429). lychee honoured the
# Retry-After header and ran for hours. scripts/check_links.py sends one request
# per second, counts 429/403 as "not checked", stops early when blocked, and
# fails only on real dead links (404, 410). No third-party action needed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["data/badges.js"]
permissions:
  contents: read
concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        run: python3 -I scripts/check_links.py
