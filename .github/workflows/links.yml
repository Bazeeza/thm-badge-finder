name: Check room links
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["data/badges.js"]
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract URLs from the data file
        run: grep -oE 'https://tryhackme\.com/[^" ]+' data/badges.js | sort -u > urls.txt && wc -l urls.txt
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --accept 200,301,302,403 --max-concurrency 4 urls.txt
          fail: true
