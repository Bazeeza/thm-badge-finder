name: Check room links
# TryHackMe rate-limits GitHub's runners (HTTP 429 "Too Many Requests").
# lychee used to retry every 429 for two hours, then fail with 229 false errors.
# Now: 429 counts as "not checked" (the link is not broken), few retries, and a
# hard 20-minute cap. Only real errors (404, 410, DNS...) fail the job.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["data/badges.js"]
permissions:
  contents: read
concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Extract URLs from the data file
        run: grep -oE 'https://tryhackme\.com/[^" ]+' data/badges.js | sort -u > urls.txt && wc -l urls.txt
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=299,301,302,403,429
            --max-concurrency 2
            --max-retries 1
            --retry-wait-time 5
            --timeout 20
            urls.txt
          fail: true
